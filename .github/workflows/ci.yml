name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # GUI-Systembibliotheken für rfd/egui und libxdo für
      # tray-icon/muda (Linux)
      - name: Install GUI system libraries (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxdo-dev
      # deny(warnings): CI fails on any clippy or rustc warning
      - run: cargo clippy --all-targets --locked -- -D warnings
        env:
          RUSTFLAGS: "-D warnings"

  fedora:
    name: fedora (rpm build + install)
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install build dependencies
        run: |
          dnf install -y git curl gcc pkgconf-pkg-config gtk3-devel libxdo-devel
      # rustup statt dnf-cargo: rust-toolchain.toml (stable) wird nur von
      # rustup beachtet, und der MSRV (1.99) liegt über Fedoras Distro-Rust.
      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL https://sh.rustup.rs \
            | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release -p oc-app --locked
      - name: Build .rpm
        run: |
          curl -sSfL https://github.com/goreleaser/nfpm/releases/download/v2.40.0/nfpm_2.40.0_Linux_x86_64.tar.gz \
            | tar -xz -C /tmp nfpm
          /tmp/nfpm package -f packaging/nfpm.yaml -p rpm -t dist/OpenCloud-Sync.rpm
      # Smoke test: the RPM must install against a clean Fedora and the
      # binary must start (links gtk3, libxdo etc. from the base image).
      - name: Install .rpm
        run: |
          dnf install -y dist/OpenCloud-Sync.rpm
      - name: Smoke test
        run: |
          test -x /usr/bin/opencloud-sync
          opencloud-sync --version

  build-test:
    name: build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      # GUI-Systembibliotheken für rfd/egui und libxdo für
      # tray-icon/muda (Linux)
      - name: Install GUI system libraries (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxdo-dev
      - run: cargo build --workspace --locked
        env:
          RUSTFLAGS: "-D warnings"
      - run: cargo test --workspace --locked
