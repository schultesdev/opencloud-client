[package]
name = "oc-app"
description = "OpenCloud sync client application: GUI, tray, main()"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
oc-api.workspace = true
oc-auth.workspace = true
oc-config.workspace = true
oc-db.workspace = true
oc-sync.workspace = true
clap.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
eframe = "0.32.3"
rfd = "0.17.2"
tray-icon = "0.24.2"

[[bin]]
name = "opencloud-sync"
path = "src/main.rs"

[lints]
workspace = true

[target."cfg(windows)".dependencies]
winreg = "0.56.0"

# tray-icon needs a gtk main loop on Linux (see gui/tray.rs); the same
# gtk version is already pulled in by tray-icon/muda and rfd.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
